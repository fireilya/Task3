<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Регистрация</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            width: 340px;
            background: #ffffff;
            padding: 24px;
            border-radius: 10px;
            box-shadow: 0 0 12px rgba(0, 0, 0, 0.12);
        }

        h1 {
            margin-top: 0;
            font-size: 24px;
        }

        label {
            display: block;
            margin-bottom: 14px;
            font-size: 14px;
        }

        input {
            width: 100%;
            margin-top: 5px;
            padding: 9px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 6px;
            background: #4caf50;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background: #43a047;
        }

        .error {
            color: #d32f2f;
            margin-bottom: 14px;
            font-size: 14px;
        }

        .link {
            margin-top: 14px;
            font-size: 14px;
        }
    </style>
</head>
<body>
<div class="card">
    <h1>Регистрация</h1>

    <div class="error" th:if="${error}" th:text="${error}"></div>

    <form th:action="@{/register}" method="post">
        <input type="hidden"
               th:if="${_csrf != null}"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}"/>

        <label>
            Логин
            <input type="email"
                   name="login"
                   maxlength="254"
                   required/>
        </label>

        <label>
            Пароль
            <input type="password"
                   name="password"
                   required/>
        </label>

        <label>
            Псевдоним
            <input type="text"
                   name="tag"
                   maxlength="50"
                   required/>
        </label>

        <label>
            Полное имя
            <input type="text"
                   name="name"/>
        </label>

        <button type="submit">Зарегистрироваться</button>
    </form>

    <div class="link">
        <a th:href="@{/login}">Уже есть аккаунт? Войти</a>
    </div>
</div>
</body>
</html>
